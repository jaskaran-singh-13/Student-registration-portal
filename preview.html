<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Application Preview</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="preview-box">

<h2 class="title">APPLICATION PREVIEW</h2>

<div class="photo-box">
<img id="previewPhoto">
</div>

<h3 class="section">Personal Details</h3>

<p><b>Name :</b> <span id="name"></span></p>
<p><b>Father Name :</b> <span id="father"></span></p>
<p><b>Mother Name :</b> <span id="mother"></span></p>
<p><b>Date of Birth :</b> <span id="dob"></span></p>
<p><b>Gender :</b> <span id="gender"></span></p>
<p><b>Phone :</b> <span id="phone"></span></p>
<p><b>Email :</b> <span id="email"></span></p>
<p><b>Aadhar :</b> <span id="adhar"></span></p>
<p><b>State :</b> <span id="state"></span></p>
<p><b>City :</b> <span id="city"></span></p>
<p><b>Pincode :</b> <span id="pincode"></span></p>

<h3 class="section">Qualification</h3>

<p><b>High School :</b> <span id="highschool"></span></p>
<p><b>High Marks :</b> <span id="highmarks"></span></p>
<p><b>Secondary School :</b> <span id="secondaryschool"></span></p>
<p><b>Secondary Marks :</b> <span id="secondarymarks"></span></p>
<p><b>Course :</b> <span id="course"></span></p>
<p><b>University :</b> <span id="university"></span></p>
<p><b>Passing Year :</b> <span id="passingyear"></span></p>

<h3 class="section">About</h3>

<p id="about"></p>

<div class="signature">
<p>Signature</p>
<img id="previewSign">
</div>

</div>

<div class="print-area">
<button onclick="window.print()" class="print-btn">Print Form</button>
</div>

<script src="my.js"></script>

</body>
</html>
